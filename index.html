<style>
:root{
  --bg:#050505;
  --bg2:#0d0d0d;
  --card:rgba(255,255,255,.06);
  --text:#fff;
  --muted:#aaa;
  --border:rgba(255,255,255,.12);
  --red:#ff2020;
  --red2:#ff5555;
}

body.light{
  --bg:#f5f5f5;
  --bg2:#fff;
  --card:rgba(0,0,0,.05);
  --text:#111;
  --muted:#555;
  --border:rgba(0,0,0,.12);
  --red:#d90000;
  --red2:#ff2020;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,0,0,.12),transparent 25%),
    radial-gradient(circle at 90% 50%,rgba(255,0,0,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  line-height:1.6;
  overflow-x:hidden;
  transition:.3s;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:999;
  padding:15px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(5,5,5,.75);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

body.light header{
  background:rgba(255,255,255,.85);
}

.logo{
  font-size:28px;
  font-weight:900;
  color:var(--red);
}

nav{
  display:flex;
  align-items:center;
}

nav a{
  color:var(--text);
  text-decoration:none;
  margin-left:18px;
  font-size:14px;
  transition:.2s;
}

nav a:hover{
  color:var(--red);
}

.menu-btn,
.theme-btn{
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 10px;
  cursor:pointer;
  font-size:16px;
}

.menu-btn{
  display:none;
  margin-left:8px;
}

/* HERO */

.hero{
  min-height:92vh;
  padding:80px 7%;
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:45px;
  align-items:center;
}

.hero-content{
  animation:fadeUp 1s ease;
}

.badge{
  display:inline-block;
  padding:8px 16px;
  border:1px solid rgba(255,40,40,.5);
  border-radius:30px;
  color:var(--red2);
  background:rgba(255,0,0,.06);
  margin-bottom:20px;
  font-size:13px;
}

.hero h1{
  font-size:clamp(55px,9vw,100px);
  line-height:1;
  margin-bottom:18px;
}

.hero h1 span{
  color:var(--red);
  text-shadow:0 0 35px rgba(255,0,0,.35);
}

.typing{
  color:var(--red2);
  font-size:21px;
  font-weight:bold;
  min-height:34px;
  margin-bottom:15px;
}

.hero p{
  max-width:650px;
  color:var(--muted);
  font-size:18px;
  margin-bottom:28px;
}

/* PROFILE */

.profile-card{
  padding:35px;
  text-align:center;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:25px;
  backdrop-filter:blur(15px);
  box-shadow:0 25px 60px rgba(0,0,0,.3);
  animation:float 5s ease-in-out infinite;
}

.avatar{
  width:120px;
  height:120px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:linear-gradient(135deg,#700000,#ff2020);
  font-size:50px;
  font-weight:900;
}

.profile-card h2{
  margin-top:18px;
}

.profile-card p{
  color:var(--muted);
}

.class-badge{
  display:inline-block;
  margin-top:18px;
  padding:8px 15px;
  border-radius:25px;
  color:var(--red2);
  background:rgba(255,0,0,.1);
  border:1px solid rgba(255,0,0,.3);
}

/* BUTTONS */

.btn{
  display:inline-block;
  padding:12px 21px;
  background:var(--red);
  color:white;
  text-decoration:none;
  border-radius:9px;
  font-weight:bold;
  margin:5px 6px 5px 0;
  transition:.25s;
}

.btn:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 30px rgba(255,0,0,.22);
}

.btn-outline{
  background:transparent;
  border:1px solid var(--red);
  color:var(--text);
}

/* SECTIONS */

section{
  padding:85px 7%;
}

.dark-section{
  background:var(--bg2);
}

.section-title{
  font-size:42px;
  margin-bottom:10px;
}

.section-title span{
  color:var(--red);
}

.section-description{
  color:var(--muted);
  margin-bottom:35px;
}

.glass{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  backdrop-filter:blur(12px);
}

/* ABOUT */

.about-box{
  padding:30px;
  max-width:850px;
}

.about-box p{
  color:var(--muted);
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.stat{
  text-align:center;
  padding:27px;
}
